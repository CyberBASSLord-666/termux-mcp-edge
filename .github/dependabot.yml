version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      rust-dependencies:
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "gradle"
    directory: "/android/shizuku-bridge"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      shizuku-bridge-dependencies:
        patterns:
          - "*"
