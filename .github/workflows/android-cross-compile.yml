              and .validation.uninstall == true
              and .validation.boundedCleanup == true
              and .validation.physicalCertification == "not_run"
            ' "$deployment_report" >/dev/null
          sha256sum "$deployment_report"

          requirement_report="$OUTPUT_ROOT/termux-observation-requirement-v3.json"
          bash scripts/classify_observation_requirement.sh \
            --repository-root "$GITHUB_WORKSPACE" \
            --source-commit fe5f7b80a8ff13c2e39951d16f37b2e37a10a36b \
            --candidate-commit "$SOURCE_SHA" \
            --emulated-report "$report" \
            --output "$requirement_report"

          full_suite_sha="$(jq -r .candidate.fullSuiteArtifact.sha256 "$report")"
          full_suite_manifest_sha="$(jq -r .candidate.fullSuiteArtifact.manifestSha256 "$report")"
          jq -e \
            --arg commit "$SOURCE_SHA" \
            --arg full_suite_sha "$full_suite_sha" \
            --arg full_suite_manifest_sha "$full_suite_manifest_sha" '
              .schemaVersion == 3
              and .classifierVersion == "3"
              and .status == "pass"
              and .releaseQualificationEligible == false
              and .candidate.commit == $commit
              and .candidate.fullSuiteArtifactSha256 == $full_suite_sha
              and .candidate.fullSuiteManifestSha256 == $full_suite_manifest_sha
              and .emulation.status == "pass"
              and .evidenceMode == "automated_release_qualification"
              and .reasonCode == "automated_native_termux_evidence_required"
              and .nextGate == "assemble_automated_release_qualification"
              and .claimBoundary.physicalDeviceObserved == false
              and .claimBoundary.androidFrameworkObserved == false
              and .claimBoundary.sustainedPhysicalSoak == false
              and .claimBoundary.physicalCertification == "not_run"
            ' "$requirement_report" >/dev/null
          sha256sum "$requirement_report"

      - name: Freeze native qualification components
        id: components
        env:
          OUTPUT_ROOT: ${{ steps.output.outputs.root }}
        run: |
          set -euo pipefail
          umask 077
          snapshot="$RUNNER_TEMP/native-qualification-components"
          test ! -e "$snapshot"
          mkdir -m 700 "$snapshot"
          members=(
            automated-native-deployment-v1.json
            termux-battery-emulated-evidence.json
            termux-command-emulated-evidence.json
            termux-native-aggregate-evidence-v4.json
            termux-observation-requirement-v3.json
            termux-volume-control-emulated-evidence.json
            termux-volume-emulated-evidence.json
          )
          for member in "${members[@]}"; do
            source="$OUTPUT_ROOT/$member"
            target="$snapshot/$member"
            test -f "$source"
            test ! -L "$source"
            test "$(stat -c %a "$source")" = 600
            source_sha="$(sha256sum "$source" | awk '{print $1}')"
            install -m 400 -- "$source" "$target"
            test -f "$target"
            test ! -L "$target"
            test "$(stat -c %a "$target")" = 400
            test "$(sha256sum "$target" | awk '{print $1}')" = "$source_sha"
            cmp -s -- "$source" "$target"
            test "$(sha256sum "$source" | awk '{print $1}')" = "$source_sha"
          done
          test "$(find "$snapshot" -mindepth 1 -maxdepth 1 -type f | wc -l)" = 7
          test "$(find "$snapshot" -mindepth 1 -maxdepth 1 ! -type f | wc -l)" = 0
          chmod 500 "$snapshot"
          sha256sum "$snapshot"/*.json
          printf 'root=%s\n' "$snapshot" >>"$GITHUB_OUTPUT"

      - name: Upload native qualification components
        # actions/upload-artifact@v7.0.1 resolved 2026-07-10
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: termux-mcp-native-qualification-components
          path: ${{ steps.components.outputs.root }}/
          if-no-files-found: error
          include-hidden-files: false
          compression-level: 0
          overwrite: false
          retention-days: 30

      - name: Freeze replayable qualified runtime snapshot
        id: runtime-snapshot
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$TERMUX_ROOTFS_IMAGE_ID" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$TERMUX_RUNTIME_IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$TERMUX_RUNTIME_IMAGE_DIGEST" != "$TERMUX_ROOTFS_IMAGE_ID"
          test -d "$TERMUX_RUNTIME_CONTEXT"
          test ! -L "$TERMUX_RUNTIME_CONTEXT"
          package_lock="$TERMUX_RUNTIME_CONTEXT/termux-runtime-package-lock-v1.json"
          test -f "$package_lock"
          test ! -L "$package_lock"
          test "$(stat -c %a "$package_lock")" = 444

          snapshot="$RUNNER_TEMP/qualified-runtime-snapshot"
          test ! -e "$snapshot"
          mkdir -m 700 "$snapshot"
          archive="$snapshot/termux-qualified-runtime-image-v1.tar.gz"
          installed="$TERMUX_RUNTIME_CONTEXT/installed-packages.tsv"
          inspect_json="$TERMUX_RUNTIME_CONTEXT/runtime-image-inspect.json"
          runtime_tag="termux-mcp-qualified-runtime:$SOURCE_SHA"
          docker tag "$TERMUX_RUNTIME_IMAGE_DIGEST" "$runtime_tag"
          docker save "$runtime_tag" | gzip -n -9 >"$archive"
          test -s "$archive"
          test "$(stat -c %s "$archive")" -le 1610612736
          test "$(od -An -t u1 -j 4 -N 4 "$archive" | tr -d ' ')" = 0000
          docker image inspect "$TERMUX_RUNTIME_IMAGE_DIGEST" >"$inspect_json"
          docker run --rm \
            --network none \
            --security-opt seccomp=unconfined \
            "$TERMUX_RUNTIME_IMAGE_DIGEST" \
            bash -c '
              set -euo pipefail
              test "$(id -u):$(id -g)" = "1000:1000"
              for required in file jq python python3 sv runsv runsvdir; do
                command -v "$required" >/dev/null
              done
              dpkg-query -W -f="\${Package}\t\${Version}\t\${Architecture}\n" |
                LC_ALL=C sort
            ' >"$installed"
          test -s "$installed"
          install -m 400 -- \
            "$package_lock" \
            "$snapshot/termux-runtime-package-lock-v1.json"
          SOURCE_SHA="$SOURCE_SHA" \
          ANDROID_RUN_ID="$GITHUB_RUN_ID" \
          BASE_DIGEST="$TERMUX_IMAGE_DIGEST" \
          BASE_IMAGE_ID="$TERMUX_ROOTFS_IMAGE_ID" \
          RUNTIME_IMAGE_ID="$TERMUX_RUNTIME_IMAGE_DIGEST" \
          SNAPSHOT_ROOT="$snapshot" \
          PACKAGE_LOCK="$snapshot/termux-runtime-package-lock-v1.json" \
          ARCHIVE="$archive" \
          INSTALLED="$installed" \
          INSPECT_JSON="$inspect_json" \
            python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import re

          def digest(path):
              value = hashlib.sha256()
              with path.open("rb") as source:
                  for chunk in iter(lambda: source.read(1024 * 1024), b""):
                      value.update(chunk)
              return value.hexdigest()

          snapshot = pathlib.Path(os.environ["SNAPSHOT_ROOT"])
          package_lock = pathlib.Path(os.environ["PACKAGE_LOCK"])
          archive = pathlib.Path(os.environ["ARCHIVE"])
          installed = pathlib.Path(os.environ["INSTALLED"])
          inspect_value = json.loads(
              pathlib.Path(os.environ["INSPECT_JSON"]).read_text(encoding="utf-8")
          )
          if not isinstance(inspect_value, list) or len(inspect_value) != 1:
              raise SystemExit("runtime image inspection invalid")
          image = inspect_value[0]
          runtime_id = os.environ["RUNTIME_IMAGE_ID"]
          expected_tag = f"termux-mcp-qualified-runtime:{os.environ['SOURCE_SHA']}"
          layers = image.get("RootFS", {}).get("Layers")
          if (
              image.get("Id") != runtime_id
              or image.get("Os") != "linux"
              or image.get("Architecture") != "arm64"
              or not isinstance(image.get("Config"), dict)
              or image["Config"].get("User") != "1000:1000"
              or image.get("RootFS", {}).get("Type") != "layers"
              or not isinstance(layers, list)
              or not layers
              or len(layers) != len(set(layers))
              or any(
                  re.fullmatch(r"sha256:[0-9a-f]{64}", item) is None
                  for item in layers
              )
              or expected_tag not in (image.get("RepoTags") or [])
          ):
              raise SystemExit("runtime image identity invalid")

          packages = []
          identities = set()
          inventory = installed.read_bytes()
          for raw_line in inventory.decode("utf-8").splitlines():
              fields = raw_line.split("\t")
              if len(fields) != 3:
                  raise SystemExit("installed package inventory invalid")
              package, version, architecture = fields
              identity = (package, version, architecture)
              if (
                  re.fullmatch(r"[a-z0-9][a-z0-9+.-]{0,127}", package) is None
                  or re.fullmatch(r"[!-~]{1,128}", version) is None
                  or re.fullmatch(r"[a-z0-9][a-z0-9-]{0,31}", architecture)
                  is None
                  or identity in identities
              ):
                  raise SystemExit("installed package identity invalid")
              identities.add(identity)
              packages.append(
                  {
                      "package": package,
                      "version": version,
                      "architecture": architecture,
                  }
              )
          if not 1 <= len(packages) <= 4096 or list(identities) == []:
              raise SystemExit("installed package count invalid")
          if [
              (item["package"], item["version"], item["architecture"])
              for item in packages
          ] != sorted(identities):
              raise SystemExit("installed package inventory is not canonical")

          value = {
              "schemaVersion": 1,
              "snapshotVersion": "1",
              "status": "pass",
              "failureCode": None,
              "releaseQualificationEligible": False,
              "repository": os.environ["GITHUB_REPOSITORY"],
              "commit": os.environ["SOURCE_SHA"],
              "androidRunId": os.environ["ANDROID_RUN_ID"],
              "base": {
                  "image": "termux/termux-docker:aarch64",
                  "digest": os.environ["BASE_DIGEST"],
                  "imageId": os.environ["BASE_IMAGE_ID"],
              },
              "runtimeImageId": runtime_id,
              "platform": {"os": "linux", "architecture": "arm64"},
              "rootfsLayers": layers,
              "packageLock": {
                  "fileName": package_lock.name,
                  "sha256": digest(package_lock),
                  "bytes": package_lock.stat().st_size,
              },
              "installedPackages": {
                  "sha256": hashlib.sha256(inventory).hexdigest(),
                  "count": len(packages),
                  "packages": packages,
              },
              "archive": {
                  "fileName": archive.name,
                  "format": "docker-image-archive-v1",
                  "compression": "gzip-no-name",
                  "sha256": digest(archive),
                  "bytes": archive.stat().st_size,
              },
              "claimBoundary": {
                  "physicalDeviceObserved": False,
                  "androidFrameworkObserved": False,
                  "sustainedPhysicalSoak": False,
                  "physicalCertification": "not_run",
              },
              "rebuildReproducibilityClaim": False,
          }
          encoded = (
              json.dumps(value, sort_keys=True, separators=(",", ":")) + "\n"
          ).encode()
          output = snapshot / "termux-runtime-snapshot-v1.json"
          descriptor = os.open(
              output,
              os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_CLOEXEC,
              0o600,
          )
          with os.fdopen(descriptor, "wb") as destination:
              destination.write(encoded)
              destination.flush()
              os.fsync(destination.fileno())
          PY
          chmod 400 \
            "$archive" \
            "$snapshot/termux-runtime-snapshot-v1.json"
          expected_names="$(
            printf '%s\n' \
              termux-qualified-runtime-image-v1.tar.gz \
              termux-runtime-package-lock-v1.json \
              termux-runtime-snapshot-v1.json |
              LC_ALL=C sort
          )"
          actual_names="$(
            find "$snapshot" -mindepth 1 -maxdepth 1 -printf '%f\n' |
              LC_ALL=C sort
          )"
          test "$actual_names" = "$expected_names"
          test "$(find "$snapshot" -mindepth 1 -maxdepth 1 -type f | wc -l)" = 3
          test "$(find "$snapshot" -mindepth 1 -maxdepth 1 ! -type f | wc -l)" = 0
          test "$(find "$snapshot" -mindepth 1 -maxdepth 1 -type f ! -perm 400 | wc -l)" = 0
          chmod 500 "$snapshot"
          sha256sum "$snapshot"/*
          printf 'root=%s\n' "$snapshot" >>"$GITHUB_OUTPUT"

      - name: Upload replayable qualified runtime snapshot
        # actions/upload-artifact@v7.0.1 resolved 2026-07-10
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: termux-mcp-qualified-runtime-snapshot
          path: |
            ${{ steps.runtime-snapshot.outputs.root }}/termux-qualified-runtime-image-v1.tar.gz
            ${{ steps.runtime-snapshot.outputs.root }}/termux-runtime-package-lock-v1.json
            ${{ steps.runtime-snapshot.outputs.root }}/termux-runtime-snapshot-v1.json
          if-no-files-found: error
          include-hidden-files: false
          compression-level: 0
          overwrite: false
          retention-days: 30
