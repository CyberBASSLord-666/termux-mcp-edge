name: Android Cross Compile

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "build.rs"
      - ".cargo/**"
      - "src/**"
      - "scripts/cross_compile.sh"
      - "scripts/package_android_artifact.sh"
      - "scripts/termux_release_validate.sh"
      - "scripts/termux_device_smoke.sh"
      - "scripts/termux_deploy.sh"
      - "scripts/termux_emulated_gate.sh"
      - "scripts/termux_battery_emulated_gate.sh"
      - "scripts/termux_volume_emulated_gate.sh"
      - "scripts/termux_volume_control_emulated_gate.sh"
      - "scripts/termux_command_emulated_gate.sh"
      - "scripts/commit_verified_file.py"
      - "scripts/verify_runtime_snapshot.sh"
      - "scripts/termux_automated_deployment_gate.sh"
      - "scripts/classify_observation_requirement.sh"
      - "scripts/verify_observation_inheritance.sh"
      - "scripts/package_automated_qualification.sh"
      - "scripts/package_physical_qualification.sh"
      - "scripts/stage_release_assets.sh"
      - "scripts/prepare_release_publication_assets.sh"
      - "scripts/publish_release_assets.sh"
      - "scripts/latest_workflow_run.jq"
      - "docs/emulated-release-evidence-schema-v*.json"
      - "docs/release-evidence-schema-v*.json"
      - "docs/android-battery-emulated-evidence-schema-v*.json"
      - "docs/android-volume-emulated-evidence-schema-v*.json"
      - "docs/android-volume-control-emulated-evidence-schema-v*.json"
      - "docs/command-emulated-evidence-schema-v*.json"
      - "docs/release-observation-requirement-schema-v*.json"
      - "docs/release-observation-inheritance-schema-v*.json"
      - "docs/release-physical-qualification-schema-v*.json"
      - "docs/release-automated-qualification-schema-v*.json"
      - "docs/release-qualification-policy*.json"
      - "docs/automated-native-deployment-*.json"
      - "docs/release-staging-manifest-schema-v*.json"
      - "docs/runtime-package-lock-schema-v*.json"
      - "docs/runtime-snapshot-schema-v*.json"
      - "docs/runtime-snapshot-replay-schema-v*.json"
      - "docs/release-evidence/v0.5.1-physical-fe5f7b80.json"
      - ".github/workflows/*"

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android-aarch64:
    name: Build aarch64-linux-android (${{ matrix.posture }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - posture: default
            features: ""
            artifact: termux-mcp-server-aarch64-linux-android-default
          - posture: mcp-runtime
            features: mcp-runtime
            artifact: termux-mcp-server-aarch64-linux-android-mcp-runtime
          - posture: android-battery-status
            features: android-battery-status
            artifact: termux-mcp-server-aarch64-linux-android-android-battery-status
          - posture: android-volume-status
            features: android-volume-status
            artifact: termux-mcp-server-aarch64-linux-android-android-volume-status
          - posture: android-volume-control
            features: android-volume-control
            artifact: termux-mcp-server-aarch64-linux-android-android-volume-control
          - posture: command-execution
            features: command-execution
            artifact: termux-mcp-server-aarch64-linux-android-command-execution
          - posture: full-suite
            features: full-suite
            artifact: termux-mcp-server-aarch64-linux-android-full-suite
    steps:
      - name: Checkout
        # actions/checkout@v7.0.1 resolved 2026-07-24
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install pinned Rust toolchain
        # dtolnay/rust-toolchain@stable resolved 2026-06-26
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: 1.88.0
          targets: aarch64-linux-android

      - name: Verify Rust toolchain and target
        run: |
          test "$(rustc --version | awk '{print $2}')" = "1.88.0"
          test "$(cargo --version | awk '{print $2}')" = "1.88.0"
          rustup target list --installed | grep -Fx aarch64-linux-android

      - name: Install Android NDK
        id: setup-ndk
        # nttld/setup-ndk@1.6.0 resolved 2026-07-10
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779
        with:
          ndk-version: r26d
          add-to-path: false

      - name: Cross compile
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          BUILD_FEATURES: ${{ matrix.features }}
        run: ./scripts/cross_compile.sh

      - name: Record exact artifact metadata
        env:
          ARTIFACT_NAME: ${{ matrix.artifact }}
          BUILD_POSTURE: ${{ matrix.posture }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          version="$(cargo metadata --locked --format-version 1 --no-deps | jq -r '.packages[] | select(.name == "termux-mcp-server") | .version')"
          [[ -n "$version" && "$version" != null ]]
          git diff --exit-code -- Cargo.toml Cargo.lock
          bash scripts/package_android_artifact.sh \
            --binary target/aarch64-linux-android/release/termux-mcp-server \
            --output-dir target/aarch64-linux-android/release-candidate \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$SOURCE_SHA" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --artifact-name "$ARTIFACT_NAME" \
            --posture "$BUILD_POSTURE" \
            --version "$version"

      - name: Upload release-candidate bundle
        # actions/upload-artifact@v7.0.1 resolved 2026-07-10
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ matrix.artifact }}
          path: target/aarch64-linux-android/release-candidate/
          if-no-files-found: error
          retention-days: 30

  termux-emulated:
    name: Native ARM64 Termux emulation
    needs: android-aarch64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 75
    env:
      TERMUX_IMAGE: termux/termux-docker:aarch64@sha256:926e5c08aebc6df89f1cb3d9558c3b56b6246e59305fcd707bdf68f2584493b3
      TERMUX_IMAGE_DIGEST: sha256:926e5c08aebc6df89f1cb3d9558c3b56b6246e59305fcd707bdf68f2584493b3
    steps:
      - name: Checkout exact source
        # actions/checkout@v7.0.1 resolved 2026-07-24
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download default artifact bundle
        # actions/download-artifact@v8.0.1 resolved 2026-07-19
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: termux-mcp-server-aarch64-linux-android-default
          path: artifacts/default

      - name: Download MCP runtime artifact bundle
        # actions/download-artifact@v8.0.1 resolved 2026-07-19
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: termux-mcp-server-aarch64-linux-android-mcp-runtime
          path: artifacts/mcp-runtime

      - name: Download Android battery artifact bundle
        # actions/download-artifact@v8.0.1 resolved 2026-07-19
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: termux-mcp-server-aarch64-linux-android-android-battery-status
          path: artifacts/android-battery-status

      - name: Download Android volume artifact bundle
        # actions/download-artifact@v8.0.1 resolved 2026-07-19
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: termux-mcp-server-aarch64-linux-android-android-volume-status
          path: artifacts/android-volume-status

      - name: Download command execution artifact bundle
        # actions/download-artifact@v8.0.1 resolved 2026-07-19
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: termux-mcp-server-aarch64-linux-android-command-execution
          path: artifacts/command-execution

      - name: Download Android volume control artifact bundle
        # actions/download-artifact@v8.0.1 resolved 2026-07-19
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: termux-mcp-server-aarch64-linux-android-android-volume-control
          path: artifacts/android-volume-control

      - name: Download full-suite artifact bundle
        # actions/download-artifact@v8.0.1 resolved 2026-07-19
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: termux-mcp-server-aarch64-linux-android-full-suite
          path: artifacts/full-suite

      - name: Verify artifact staging
        id: artifacts
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          bundles=(
            'default|default|termux-mcp-server-aarch64-linux-android-default|[]'
            'mcp-runtime|mcp-runtime|termux-mcp-server-aarch64-linux-android-mcp-runtime|["mcp-runtime"]'
            'android-battery-status|android-battery-status|termux-mcp-server-aarch64-linux-android-android-battery-status|["android-battery-status"]'
            'android-volume-status|android-volume-status|termux-mcp-server-aarch64-linux-android-android-volume-status|["android-volume-status"]'
            'android-volume-control|android-volume-control|termux-mcp-server-aarch64-linux-android-android-volume-control|["android-volume-control"]'
            'command-execution|command-execution|termux-mcp-server-aarch64-linux-android-command-execution|["command-execution"]'
            'full-suite|full-suite|termux-mcp-server-aarch64-linux-android-full-suite|["full-suite"]'
          )
          for bundle in "${bundles[@]}"; do
            IFS='|' read -r directory posture artifact_name features <<<"$bundle"
            root="artifacts/$directory"
            test "$(find "$root" -mindepth 1 -maxdepth 1 | wc -l)" = 3
            test -f "$root/termux-mcp-server"
            test -f "$root/SHA256SUMS"
            test -f "$root/artifact-manifest.json"
            test ! -L "$root/termux-mcp-server"
            test ! -L "$root/SHA256SUMS"
            test ! -L "$root/artifact-manifest.json"
            chmod 755 "$root/termux-mcp-server"
            chmod 644 "$root/SHA256SUMS" "$root/artifact-manifest.json"
            (cd "$root" && sha256sum -c SHA256SUMS)
            actual_sha="$(sha256sum "$root/termux-mcp-server" | awk '{print $1}')"
            actual_bytes="$(stat -c %s "$root/termux-mcp-server")"
            identity="$(file -b "$root/termux-mcp-server")"
            [[ "$identity" == *ELF* && "$identity" == *"ARM aarch64"* ]]
            [[ "$identity" == *Android* || "$identity" == *"/system/bin/linker64"* ]]
            jq -e \
              --arg commit "${{ github.event.pull_request.head.sha || github.sha }}" \
              --arg run_id "$GITHUB_RUN_ID" \
              --arg artifact_name "$artifact_name" \
              --arg posture "$posture" \
              --arg sha "$actual_sha" \
              --argjson bytes "$actual_bytes" \
              --argjson features "$features" '
                (keys == ["artifactName","bytes","commit","createdAt","elf","features","fileName","posture","repository","schemaVersion","sha256","target","version","workflowRunId"])
                and .schemaVersion == 1
                and .repository == "CyberBASSLord-666/termux-mcp-edge"
                and .commit == $commit
                and .workflowRunId == $run_id
                and .artifactName == $artifact_name
                and .posture == $posture
                and .features == $features
                and .target == "aarch64-linux-android"
                and .fileName == "termux-mcp-server"
                and .elf == "aarch64-android-elf"
                and .sha256 == $sha
                and .bytes == $bytes
              ' "$root/artifact-manifest.json" >/dev/null
          done
          default_version="$(jq -r .version artifacts/default/artifact-manifest.json)"
          mcp_version="$(jq -r .version artifacts/mcp-runtime/artifact-manifest.json)"
          battery_version="$(jq -r .version artifacts/android-battery-status/artifact-manifest.json)"
          volume_version="$(jq -r .version artifacts/android-volume-status/artifact-manifest.json)"
          volume_control_version="$(jq -r .version artifacts/android-volume-control/artifact-manifest.json)"
          command_version="$(jq -r .version artifacts/command-execution/artifact-manifest.json)"
          full_suite_version="$(jq -r .version artifacts/full-suite/artifact-manifest.json)"
          [[ "$default_version" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$ ]]
          test "$mcp_version" = "$default_version"
          test "$battery_version" = "$default_version"
          test "$volume_version" = "$default_version"
          test "$volume_control_version" = "$default_version"
          test "$command_version" = "$default_version"
          test "$full_suite_version" = "$default_version"
          printf 'version=%s\n' "$default_version" >>"$GITHUB_OUTPUT"

      - name: Resolve exact companion workflow evidence
        id: evidence
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          WORKFLOW_EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$SOURCE_SHA&per_page=100"
          ci_run_id=''
          security_run_id=''
          monotonic_seconds() {
            local uptime
            read -r uptime _ </proc/uptime
            printf '%s\n' "${uptime%%.*}"
          }
          readonly max_wait_seconds=2700
          readonly deadline=$(( $(monotonic_seconds) + max_wait_seconds ))
          attempt=0
          while :; do
            now="$(monotonic_seconds)"
            remaining=$((deadline - now))
            (( remaining > 0 )) || break
            attempt=$((attempt + 1))
            curl_timeout=15
            (( remaining < curl_timeout )) && curl_timeout="$remaining"
            connect_timeout=5
            (( curl_timeout < connect_timeout )) && connect_timeout="$curl_timeout"
            response="$(curl --fail --silent --show-error --location \
              --connect-timeout "$connect_timeout" \
              --max-time "$curl_timeout" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$api")"
            ci_state="$(jq -L scripts -r --arg sha "$SOURCE_SHA" --arg event "$WORKFLOW_EVENT" '
              include "latest_workflow_run";
              complete_workflow_run_page
              | [.[] | select(
                .name == "CI"
                and .path == ".github/workflows/ci.yml"
                and .head_sha == $sha
                and .event == $event
              )]
              | latest_workflow_run_or_null
              | if . == null then "missing" else
                  (.status + ":" + (.conclusion // "pending") + ":" + (.id | tostring) + ":" + (.run_attempt | tostring))
                end
            ' <<<"$response")"
            security_state="$(jq -L scripts -r --arg sha "$SOURCE_SHA" --arg event "$WORKFLOW_EVENT" '
              include "latest_workflow_run";
              complete_workflow_run_page
              | [.[] | select(
                .name == "Security"
                and .path == ".github/workflows/security.yml"
                and .head_sha == $sha
                and .event == $event
              )]
              | latest_workflow_run_or_null
              | if . == null then "missing" else
                  (.status + ":" + (.conclusion // "pending") + ":" + (.id | tostring) + ":" + (.run_attempt | tostring))
                end
            ' <<<"$response")"
            if [[ "$ci_state" != missing && "${ci_state##*:}" != 1 ]]; then
              printf 'latest exact-head CI is not a first attempt: %s\n' "$ci_state" >&2
              exit 1
            fi
            if [[ "$security_state" != missing && "${security_state##*:}" != 1 ]]; then
              printf 'latest exact-head Security is not a first attempt: %s\n' "$security_state" >&2
              exit 1
            fi
            if [[ "$ci_state" == completed:success:*:1 && "$security_state" == completed:success:*:1 ]]; then
              IFS=: read -r _ _ ci_run_id _ <<<"$ci_state"
              IFS=: read -r _ _ security_run_id _ <<<"$security_state"
              break
            fi
            if [[ "$ci_state" == completed:* && "$ci_state" != completed:success:*:1 ]]; then
              printf 'latest exact-head CI is not successful: %s\n' "$ci_state" >&2
              exit 1
            fi
            if [[ "$security_state" == completed:* && "$security_state" != completed:success:*:1 ]]; then
              printf 'latest exact-head Security is not successful: %s\n' "$security_state" >&2
              exit 1
            fi
            now="$(monotonic_seconds)"
            remaining=$((deadline - now))
            (( remaining > 0 )) || break
            sleep_seconds=5
            (( remaining < sleep_seconds )) && sleep_seconds="$remaining"
            printf 'waiting for exact companion workflows (attempt %s; %ss remaining): CI=%s Security=%s\n' \
              "$attempt" "$remaining" "$ci_state" "$security_state"
            sleep "$sleep_seconds"
          done
          [[ "$ci_run_id" =~ ^[1-9][0-9]*$ ]]
          [[ "$security_run_id" =~ ^[1-9][0-9]*$ ]]
          printf 'ci_run_id=%s\n' "$ci_run_id" >>"$GITHUB_OUTPUT"
          printf 'security_run_id=%s\n' "$security_run_id" >>"$GITHUB_OUTPUT"

      - name: Prepare private evidence output
        id: output
        run: |
          set -euo pipefail
          output_root="$RUNNER_TEMP/termux-emulated-evidence"
          mkdir -p "$output_root"
          chmod 700 "$output_root"
          sudo chown 1000:1000 "$output_root"
          printf 'root=%s\n' "$output_root" >>"$GITHUB_OUTPUT"

      - name: Run exact artifacts in official Termux environment
        env:
          CI_RUN_ID: ${{ steps.evidence.outputs.ci_run_id }}
          SECURITY_RUN_ID: ${{ steps.evidence.outputs.security_run_id }}
          EXPECTED_VERSION: ${{ steps.artifacts.outputs.version }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          OUTPUT_ROOT: ${{ steps.output.outputs.root }}
        run: |
          set -euo pipefail
          docker pull "$TERMUX_IMAGE"
          docker image inspect "$TERMUX_IMAGE" --format '{{json .RepoDigests}}' | grep -F "$TERMUX_IMAGE_DIGEST"
          rootfs_image_id="$(docker image inspect "$TERMUX_IMAGE" --format '{{.Id}}')"
          [[ "$rootfs_image_id" =~ ^sha256:[0-9a-f]{64}$ ]]
          runtime_context="$RUNNER_TEMP/termux-native-runtime"
          mkdir -m 700 "$runtime_context"
          mkdir -m 700 \
            "$runtime_context/package-inputs" \
            "$runtime_context/package-inputs/debs" \
            "$runtime_context/package-inputs/indexes"
          sudo chown -R 1000:1000 "$runtime_context/package-inputs"
          docker run --rm \
            --network bridge \
            --security-opt seccomp=unconfined \
            -v "$runtime_context/package-inputs:/runtime-inputs" \
            "$rootfs_image_id" \
            bash -c '
              set -euo pipefail
              umask 077
              export DEBIAN_FRONTEND=noninteractive
              readonly runtime_download_root=/runtime-inputs/.apt-cache
              readonly runtime_download_cache="$runtime_download_root/archives"
              test ! -e "$runtime_download_root"
              test ! -L "$runtime_download_root"
              mkdir -m 700 "$runtime_download_root"
              mkdir -m 700 "$runtime_download_cache"
              mkdir -m 700 "$runtime_download_cache/partial"
              cleanup_runtime_download_cache() {
                rm -rf -- "$runtime_download_root"
              }
              trap cleanup_runtime_download_cache EXIT
              apt-get update
              apt-get \
                -o "Dir::Cache::archives=$runtime_download_cache/" \
                -o APT::Keep-Downloaded-Packages=true \
                install \
                --download-only \
                --no-install-recommends \
                -y \
                file jq python termux-services
              downloaded_deb_count="$(
                find "$runtime_download_cache" \
                  -mindepth 1 -maxdepth 1 -type f -name "*.deb" |
                  wc -l
              )"
              [[ "$downloaded_deb_count" =~ ^[1-9][0-9]*$ ]]
              ((downloaded_deb_count >= 4 && downloaded_deb_count <= 512))
              find "$runtime_download_cache" \
                -mindepth 1 -maxdepth 1 -type f -name "*.deb" \
                -exec cp --no-clobber -- "{}" /runtime-inputs/debs/ \;
              find "$PREFIX/var/lib/apt/lists" \
                -mindepth 1 -maxdepth 1 -type f -name "*InRelease" \
                -exec cp --no-clobber -- "{}" /runtime-inputs/indexes/ \;
              frozen_deb_count="$(
                find /runtime-inputs/debs \
                  -mindepth 1 -maxdepth 1 -type f -name "*.deb" |
                  wc -l
              )"
              test "$frozen_deb_count" = "$downloaded_deb_count"
              test "$(find /runtime-inputs/indexes -mindepth 1 -maxdepth 1 -type f | wc -l)" -ge 1
              cleanup_runtime_download_cache
              trap - EXIT
              test ! -e "$runtime_download_root"
              test ! -L "$runtime_download_root"
            '
          sudo chown -R "$(id -u):$(id -g)" "$runtime_context/package-inputs"
          expected_package_input_names="$(
            printf '%s\n' debs indexes |
              LC_ALL=C sort
          )"
          actual_package_input_names="$(
            find "$runtime_context/package-inputs" \
              -mindepth 1 -maxdepth 1 -printf '%f\n' |
              LC_ALL=C sort
          )"
          test "$actual_package_input_names" = "$expected_package_input_names"
          test "$(find "$runtime_context/package-inputs" -mindepth 1 -maxdepth 1 -type d | wc -l)" = 2
          test "$(find "$runtime_context/package-inputs" -mindepth 1 -maxdepth 1 ! -type d | wc -l)" = 0
          chmod 700 \
            "$runtime_context/package-inputs" \
            "$runtime_context/package-inputs/debs" \
            "$runtime_context/package-inputs/indexes"
          find "$runtime_context/package-inputs" -type f -exec chmod 600 -- {} +
          test "$(find "$runtime_context/package-inputs/debs" -mindepth 1 -maxdepth 1 ! -type f | wc -l)" = 0
          test "$(find "$runtime_context/package-inputs/indexes" -mindepth 1 -maxdepth 1 ! -type f | wc -l)" = 0
          command -v dpkg-deb >/dev/null
          SOURCE_SHA="$SOURCE_SHA" \
          ANDROID_RUN_ID="$GITHUB_RUN_ID" \
          BASE_DIGEST="$TERMUX_IMAGE_DIGEST" \
          BASE_IMAGE_ID="$rootfs_image_id" \
          RUNTIME_CONTEXT="$runtime_context" \
            python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import re
          import subprocess

          root = pathlib.Path(os.environ["RUNTIME_CONTEXT"])
          deb_root = root / "package-inputs" / "debs"
          index_root = root / "package-inputs" / "indexes"
          output = root / "termux-runtime-package-lock-v1.json"
          if output.exists() or output.is_symlink():
              raise SystemExit("package lock output already exists")

          def record(path):
              if not path.is_file() or path.is_symlink():
                  raise SystemExit("package input is not a regular file")
              size = path.stat().st_size
              if not 1 <= size <= 268435456:
                  raise SystemExit("package input size invalid")
              digest = hashlib.sha256()
              with path.open("rb") as source:
                  for chunk in iter(lambda: source.read(1024 * 1024), b""):
                      digest.update(chunk)
              return {
                  "fileName": path.name,
                  "sha256": digest.hexdigest(),
                  "bytes": size,
              }

          packages = []
          for path in sorted(deb_root.iterdir(), key=lambda item: item.name):
              metadata = []
              for field in ("Package", "Version", "Architecture"):
                  value = subprocess.run(
                      ["dpkg-deb", "--field", str(path), field],
                      check=True,
                      capture_output=True,
                      text=True,
                  ).stdout.strip()
                  metadata.append(value)
              package, version, architecture = metadata
              if (
                  re.fullmatch(r"[a-z0-9][a-z0-9+.-]{0,127}", package) is None
                  or re.fullmatch(r"[!-~]{1,128}", version) is None
                  or re.fullmatch(r"[a-z0-9][a-z0-9-]{0,31}", architecture) is None
              ):
                  raise SystemExit("Debian package identity invalid")
              packages.append(
                  {
                      "package": package,
                      "version": version,
                      "architecture": architecture,
                      **record(path),
                  }
              )
          packages.sort(
              key=lambda item: (
                  item["package"],
                  item["version"],
                  item["architecture"],
                  item["fileName"],
              )
          )
          if not 1 <= len(packages) <= 512:
              raise SystemExit("Debian package count invalid")
          identities = {
              (item["package"], item["version"], item["architecture"])
              for item in packages
          }
          if len(identities) != len(packages):
              raise SystemExit("duplicate Debian package identity")
          requested = ["file", "jq", "python", "termux-services"]
          if not set(requested).issubset({item["package"] for item in packages}):
              raise SystemExit("requested package bytes were not all frozen")

          indexes = [
              record(path)
              for path in sorted(index_root.iterdir(), key=lambda item: item.name)
          ]
          if not 1 <= len(indexes) <= 16:
              raise SystemExit("signed repository index count invalid")
          value = {
              "schemaVersion": 1,
              "lockVersion": "1",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "commit": os.environ["SOURCE_SHA"],
              "androidRunId": os.environ["ANDROID_RUN_ID"],
              "base": {
                  "image": "termux/termux-docker:aarch64",
                  "digest": os.environ["BASE_DIGEST"],
                  "imageId": os.environ["BASE_IMAGE_ID"],
              },
              "requestedPackages": requested,
              "resolution": {
                  "resolver": "termux-apt-download-only",
                  "repositoryMetadataAuthenticated": True,
                  "packageBytesFrozenBeforeBuild": True,
                  "finalImageBuildNetwork": "none",
              },
              "installation": {
                  "method": "termux-dpkg-unpack-configure",
                  "dependencyRepair": "none",
                  "runtimeUser": "1000:1000",
              },
              "repositoryIndexes": indexes,
              "packages": packages,
          }
          encoded = (
              json.dumps(value, sort_keys=True, separators=(",", ":")) + "\n"
          ).encode()
          if len(encoded) > 16777216:
              raise SystemExit("package lock too large")
          descriptor = os.open(
              output,
              os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_CLOEXEC,
              0o600,
          )
          with os.fdopen(descriptor, "wb") as destination:
              destination.write(encoded)
              destination.flush()
              os.fsync(destination.fileno())
          PY
          chmod 0555 \
            "$runtime_context/package-inputs/debs" \
            "$runtime_context/package-inputs/indexes"
          find "$runtime_context/package-inputs" -type f -exec chmod 0444 -- {} +
          chmod 0444 "$runtime_context/termux-runtime-package-lock-v1.json"
          cat >"$runtime_context/Dockerfile" <<'DOCKERFILE'
          FROM termux/termux-docker:aarch64@sha256:926e5c08aebc6df89f1cb3d9558c3b56b6246e59305fcd707bdf68f2584493b3
          COPY --chown=0:0 package-inputs/debs/ /data/data/com.termux/files/usr/share/termux-mcp/runtime-packages/
          COPY --chown=0:0 package-inputs/indexes/ /data/data/com.termux/files/usr/share/termux-mcp/runtime-repository-indexes/
          COPY --chown=0:0 termux-runtime-package-lock-v1.json /data/data/com.termux/files/usr/share/termux-mcp/termux-runtime-package-lock-v1.json
          USER 1000:1000
          RUN set -eu; \
              export LC_ALL=C DEBIAN_FRONTEND=noninteractive; \
              package_root=/data/data/com.termux/files/usr/share/termux-mcp/runtime-packages; \
              index_root=/data/data/com.termux/files/usr/share/termux-mcp/runtime-repository-indexes; \
              lock_path=/data/data/com.termux/files/usr/share/termux-mcp/termux-runtime-package-lock-v1.json; \
              deb_markers="$(find "$package_root" -mindepth 1 -maxdepth 1 -type f -name '*.deb' -exec printf x \;)"; \
              deb_count="${#deb_markers}"; \
              test "$deb_count" -ge 1; \
              test "$deb_count" -le 512; \
              unexpected_package_inputs="$(find "$package_root" -mindepth 1 -maxdepth 1 ! -type f -print -quit)"; \
              test -z "$unexpected_package_inputs"; \
              nested_package_inputs="$(find "$package_root" -mindepth 2 -print -quit)"; \
              test -z "$nested_package_inputs"; \
