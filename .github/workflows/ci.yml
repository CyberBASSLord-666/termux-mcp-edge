name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "build.rs"
      - ".cargo/**"
      - "src/**"
      - "tests/**"
      - "benches/**"
      - "examples/**"
      - "scripts/**"
      - "*.md"
      - "docs/**/*.md"
      - "docs/release-evidence-schema-v*.json"
      - "docs/emulated-release-evidence-schema-v*.json"
      - "docs/android-battery-emulated-evidence-schema-v*.json"
      - "docs/android-volume-emulated-evidence-schema-v*.json"
      - "docs/android-volume-control-emulated-evidence-schema-v*.json"
      - "docs/command-emulated-evidence-schema-v*.json"
      - "docs/release-observation-requirement-schema-v*.json"
      - "docs/release-observation-inheritance-schema-v*.json"
      - "docs/release-physical-qualification-schema-v*.json"
      - "docs/release-automated-qualification-schema-v*.json"
      - "docs/release-qualification-policy*.json"
      - "docs/automated-native-deployment-*.json"
      - "docs/release-staging-manifest-schema-v*.json"
      - "docs/runtime-package-lock-schema-v*.json"
      - "docs/runtime-snapshot-schema-v*.json"
      - "docs/runtime-snapshot-replay-schema-v*.json"
      - "docs/release-evidence/v0.5.1-physical-fe5f7b80.json"
      - ".github/ci-requirements.txt"
      - ".github/workflows/*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static-analysis:
    name: Static analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        # actions/checkout@v7.0.1 resolved 2026-07-24
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install pinned Python
        # actions/setup-python@v7 resolved 2026-07-29
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.11"
          cache: pip
          cache-dependency-path: .github/ci-requirements.txt

      - name: Install pinned Python dependencies
        run: |
          python3 -m venv "${RUNNER_TEMP}/ci-python"
          "${RUNNER_TEMP}/ci-python/bin/python" -m pip install \
            --disable-pip-version-check \
            --no-deps \
            --only-binary=:all: \
            --require-hashes \
            -r .github/ci-requirements.txt
          "${RUNNER_TEMP}/ci-python/bin/python" -c \
            'import yaml; assert yaml.__version__ == "6.0.3"'

      - name: Install checksum-verified shell analyzers
        env:
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          ACTIONLINT_URL: https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
          SHELLCHECK_URL: https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
        run: |
          actionlint_archive="${RUNNER_TEMP}/actionlint.tar.gz"
          actionlint_root="${RUNNER_TEMP}/actionlint"
          shellcheck_archive="${RUNNER_TEMP}/shellcheck.tar.xz"
          shellcheck_root="${RUNNER_TEMP}/shellcheck"

          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$actionlint_archive" "$ACTIONLINT_URL"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$actionlint_archive" \
            | sha256sum --check --strict
          install -d -m 700 "$actionlint_root"
          tar --no-same-owner -xzf "$actionlint_archive" -C "$actionlint_root"

          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$shellcheck_archive" "$SHELLCHECK_URL"
          printf '%s  %s\n' "$SHELLCHECK_SHA256" "$shellcheck_archive" \
            | sha256sum --check --strict
          install -d -m 700 "$shellcheck_root"
          tar --no-same-owner -xJf "$shellcheck_archive" -C "$shellcheck_root"

          test "$("$actionlint_root/actionlint" -version | head -n 1)" = "1.7.12"
          test "$(
            "$shellcheck_root/shellcheck-v0.11.0/shellcheck" --version \
              | awk '$1 == "version:" { print $2 }'
          )" = "0.11.0"

      - name: Validate workflows and shell
        run: |
          actionlint="${RUNNER_TEMP}/actionlint/actionlint"
          shellcheck="${RUNNER_TEMP}/shellcheck/shellcheck-v0.11.0/shellcheck"
          shellcheck_wrapper="${RUNNER_TEMP}/shellcheck-warning"
          printf '%s\n' \
            '#!/usr/bin/env bash' \
            'exec "${SHELLCHECK_BINARY:?}" --severity=warning "$@"' \
            >"$shellcheck_wrapper"
          chmod 700 "$shellcheck_wrapper"

          SHELLCHECK_BINARY="$shellcheck" \
            "$actionlint" -shellcheck="$shellcheck_wrapper"
          "$shellcheck" -x -S warning scripts/*.sh tests/*.sh
          find scripts tests -type f -name '*.sh' -exec bash -n {} +

  rust:
    name: Rust validation
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        # actions/checkout@v7.0.1 resolved 2026-07-24
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        # dtolnay/rust-toolchain@stable resolved 2026-06-26
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy

      - name: Verify Rust toolchain
        run: |
          test "$(rustc --version | awk '{print $2}')" = "1.88.0"
          test "$(cargo --version | awk '{print $2}')" = "1.88.0"
          rustfmt --version
          cargo clippy --version

      - name: Verify locked dependency graph
        run: |
          metadata="$(cargo metadata --locked --all-features --format-version 1 --no-deps)"
          full_suite="$(jq -c '
            .packages[]
            | select(.name == "termux-mcp-server")
            | .features["full-suite"]
            | sort
          ' <<<"$metadata")"
          test "$full_suite" = '["android-battery-status","android-volume-control","android-volume-status","command-execution","mcp-runtime"]'
          git diff --exit-code -- Cargo.toml Cargo.lock

      - name: Cache cargo registry and build outputs
        # Swatinem/rust-cache@v2 resolved 2026-06-26
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32

      - name: Verify cache setup preserved dependency inputs
        run: git diff --exit-code -- Cargo.toml Cargo.lock

      - name: Format check
        run: |
          cargo fmt --all -- --check
          git diff --exit-code -- Cargo.toml Cargo.lock

      - name: Clippy (default posture)
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Clippy (MCP runtime posture)
        run: cargo clippy --locked --workspace --all-targets --features mcp-runtime -- -D warnings

      - name: Clippy (full-suite posture)
        run: cargo clippy --locked --workspace --all-targets --features full-suite -- -D warnings

      - name: Clippy (all features)
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Tests (default posture)
        run: timeout --verbose --signal=TERM --kill-after=30s 8m cargo test --locked --workspace --all-targets

      - name: Tests (MCP runtime posture)
        run: timeout --verbose --signal=TERM --kill-after=30s 8m cargo test --locked --workspace --all-targets --features mcp-runtime

      - name: Tests (full-suite posture)
        run: timeout --verbose --signal=TERM --kill-after=30s 8m cargo test --locked --workspace --all-targets --features full-suite

      - name: Tests (all features)
        run: timeout --verbose --signal=TERM --kill-after=30s 8m cargo test --locked --workspace --all-targets --all-features

      - name: Release build (full-suite posture)
        run: cargo build --locked --release --features full-suite

      - name: Install pinned shell-test Python
        # actions/setup-python@v7 resolved 2026-07-29
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.11"
          cache: pip
          cache-dependency-path: .github/ci-requirements.txt

      - name: Install pinned shell-test dependencies
        run: |
          python3 -m venv "${RUNNER_TEMP}/ci-python"
          "${RUNNER_TEMP}/ci-python/bin/python" -m pip install \
            --disable-pip-version-check \
            --no-deps \
            --only-binary=:all: \
            --require-hashes \
            -r .github/ci-requirements.txt
          "${RUNNER_TEMP}/ci-python/bin/python" -c \
            'import yaml; assert yaml.__version__ == "6.0.3"'
          printf '%s\n' "${RUNNER_TEMP}/ci-python/bin" >>"$GITHUB_PATH"

      - name: Shell contract tests
        run: |
          bash tests/package_android_artifact_test.sh
          bash tests/termux_deploy_test.sh
          bash tests/termux_device_smoke_test.sh
          bash tests/termux_emulated_gate_test.sh
          bash tests/termux_release_validate_test.sh
          bash tests/setup_named_tunnel_test.sh
          bash tests/documentation_contract_test.sh
          bash tests/cross_compile_contract_test.sh
          bash tests/package_physical_qualification_test.sh
          bash tests/commit_verified_file_test.sh
          bash tests/termux_automated_deployment_gate_test.sh
          bash tests/package_automated_qualification_test.sh
          bash tests/runtime_snapshot_replay_test.sh
          bash tests/automated_release_qualification_workflow_test.sh
          bash tests/stage_release_assets_test.sh
          bash tests/release_staging_workflow_test.sh
          bash tests/prepare_release_publication_assets_test.sh
          bash tests/publish_release_assets_test.sh
          bash tests/release_publication_workflow_test.sh
          bash -n scripts/termux_command_emulated_gate.sh
          jq -e '.type == "object" and .additionalProperties == false' \
            docs/command-emulated-evidence-schema-v3.json >/dev/null

      - name: Verify dependency inputs remained unchanged
        run: git diff --exit-code -- Cargo.toml Cargo.lock
